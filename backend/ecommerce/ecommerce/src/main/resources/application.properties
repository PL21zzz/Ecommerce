# 1. Cấu hình cơ sở dữ liệu H2 tự động (Chạy trực tiếp không phụ thuộc Docker)
spring.datasource.url=jdbc:h2:file:./data/coffee_ecommerce_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=phong_coffee
spring.datasource.password=phong_coffee

# 2. Cấu hình Hibernate & Console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
server.address=0.0.0.0

